           用户管理 Tab：在线列表 / 禁言 / 踢出 / 黑名单 / 禁言名单
           ============================================================ */
        // 加载在线用户列表，每行附"禁言/踢出"按钮（管理员行不显示操作）
        function loadAdminUsers() {
            fetch(roomBase + '/api/admin/online_users', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ admin_id: userId })
            }).then(res => res.json()).then(data => {
                const list = document.getElementById('admin-user-list');
                list.innerHTML = data.users.map(u => {
                    // 管理员不显示禁言和踢出按钮
                    const isAdminUser = u.is_admin;
                    const muteIndicator = (!isAdminUser && u.muted_remaining > 0)
                        ? `<span style="font-size:0.75rem;color:#e67e22;"> [禁言${u.muted_remaining}秒]</span>` : '';
                    const buttons = isAdminUser ? '' : `
                        <button class="mute-btn" data-id="${u.user_id}">禁言</button>
                        <button class="kick-btn" data-id="${u.user_id}">踢出</button>
                    `;
                    return `
                        <div class="admin-user-item">
                            <span>${u.avatar} ${escapeHtml(u.nickname)}${u.is_admin ? ' (admin)' : ''}${muteIndicator}</span>
                            <span style="font-size:0.8rem;">${u.ip}</span>
                            <div>${buttons}</div>
                        </div>
                    `;
                }).join('');
                list.querySelectorAll('.mute-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const targetId = btn.dataset.id;
                        const duration = prompt('禁言秒数(10,60,300,600,3600)', '60');
                        if (duration === null) return;
                        const seconds = parseInt(duration, 10);
                        if (!seconds || seconds <= 0) { alert('请输入有效的秒数'); return; }
                        fetch(roomBase + '/api/admin/mute_user', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ admin_id: userId, target_id: targetId, duration: seconds })
                        });
                    });
                });
                list.querySelectorAll('.kick-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const targetId = btn.dataset.id;
                        if (confirm('踢出该用户?')) {
                            fetch(roomBase + '/api/admin/kick_user', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ admin_id: userId, target_id: targetId })
                            }).then(res => res.json()).then(d => {
                                if (d.error) { alert(d.error); return; }
                                loadAdminUsers();
                                loadBlacklist();
                            });
                        }
                    });
                });
            });
        }

        // 加载黑名单（设备 ID 维度，展示踢出时的昵称和 IP），附"解除"按钮
        function loadBlacklist() {
            fetch(roomBase + '/api/admin/blacklist?user_id=' + encodeURIComponent(userId)).then(res => res.json()).then(data => {
                const container = document.getElementById('blacklist-container');
                // 黑名单按设备 ID 维度，同时展示踢出时的昵称和 IP 方便辨认
                container.innerHTML = (data.items || []).map(item => `
                        <div>${escapeHtml(item.nickname || item.device_id)}
                            <span style="font-size:0.8rem;color:#999;">(${escapeHtml(item.ip || '未知IP')})</span>
                            <button onclick="removeBlacklist('${item.device_id}')">解除</button></div>`).join('');
                window.removeBlacklist = function (blockedDeviceId) {
                    fetch(roomBase + '/api/admin/remove_blacklist', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ user_id: userId, device_id: blockedDeviceId })
                    }).then(() => loadBlacklist());
                };
            });
        }

        // ===== 禁言名单相关 =====
        // mutedCountdownTimer：每秒刷新剩余秒数的定时器，列表为空时清除
        let mutedCountdownTimer = null;

        // 加载禁言名单 + 绑定"解禁"按钮 + 启动倒计时刷新
        function loadMutedUsers() {
            fetch(roomBase + '/api/admin/muted_users?user_id=' + encodeURIComponent(userId)).then(res => res.json()).then(data => {
                const container = document.getElementById('muted-list-container');
                const users = data.users || [];
                if (users.length === 0) {
                    container.innerHTML = '<p style="color:#999;font-size:0.85rem;">当前没有被禁言的用户</p>';
                    if (mutedCountdownTimer) { clearInterval(mutedCountdownTimer); mutedCountdownTimer = null; }
                    return;
                }
                container.innerHTML = users.map(u => {
                    const statusText = u.online ? `${u.nickname}` : `${u.nickname} (离线)`;
                    return `
                        <div class="admin-user-item">
                            <span>${u.avatar || '😀'} ${escapeHtml(statusText)}</span>
                            <span class="muted-countdown" data-until="${u.muted_until}" style="font-size:0.8rem;color:#e67e22;margin:0 6px;">
                                剩余 ${u.remaining}秒
                            </span>
                            <button class="unmute-btn" data-uid="${u.user_id || ''}" data-did="${u.device_id}" style="padding:3px 10px;background:#12b7f5;color:white;border:none;border-radius:4px;cursor:pointer;font-size:0.78rem;font-weight:500;">解禁</button>
                        </div>
                    `;
                }).join('');

                // 绑定解禁按钮
                container.querySelectorAll('.unmute-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const targetUid = btn.dataset.uid;
                        const targetDid = btn.dataset.did;
                        if (!targetUid) { alert('该用户已离线，无法在线解除禁言（禁言将在到期后自动清除）'); return; }
                        fetch(roomBase + '/api/admin/unmute_user', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ admin_id: userId, target_id: targetUid })
                        }).then(res => res.json()).then(d => {
                            if (d.success) {
                                loadMutedUsers();
                                loadAdminUsers();
                            } else {
                                alert(d.error);
                            }
                        });
                    });
                });

                // 启动倒计时刷新
                if (mutedCountdownTimer) clearInterval(mutedCountdownTimer);
                mutedCountdownTimer = setInterval(() => {
                    let anyRemaining = false;
                    container.querySelectorAll('.muted-countdown').forEach(el => {
                        const until = parseFloat(el.dataset.until);
                        const remaining = Math.max(0, Math.ceil(until - Date.now() / 1000));
                        if (remaining > 0) {
                            el.textContent = `剩余 ${remaining}秒`;
                            anyRemaining = true;
                        } else {
                            el.textContent = '已到期';
                            el.style.color = '#999';
                        }
                    });
                    if (!anyRemaining) {
                        loadMutedUsers();  // 全部到期，刷新列表
                    }
                }, 1000);
            });
        }

        /* ============================================================
           房间设置：名称 / 密码 / 开关
           ============================================================ */
        // 保存房间名称（SSE room_name 事件会同步所有客户端标题）
        function saveRoomName() {
            const name = document.getElementById('room-name-input').value.trim();
            fetch(roomBase + '/api/admin/set_room_name', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user_id: userId, name })
            });
        }

        // 设置房间密码（非空）
        function setPassword() {
            const pw = document.getElementById('password-input-admin').value.trim();
            fetch(roomBase + '/api/admin/set_password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user_id: userId, password: pw })
            }).then(res => res.json()).then(d => alert(d.success ? '密码已设置' : (d.error || '设置失败')));
        }

        // 清除房间密码（password 传空串）
        function clearPassword() {
            fetch(roomBase + '/api/admin/set_password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user_id: userId, password: '' })
            }).then(res => res.json()).then(d => alert(d.success ? '密码已清除' : (d.error || '清除失败')));
        }

        // 开/关房间：先读当前状态取反再提交；关闭成功后断开 SSE 并跳 /admin
        function toggleRoomOpen() {
            fetch(roomBase + '/api/room_status').then(res => res.json()).then(data => {
                const newOpen = !data.open;
                fetch(roomBase + '/api/admin/set_room_open', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: userId, open: newOpen })
                }).then(res => res.json()).then(d => {
                    alert(d.open ? '房间已打开' : '房间已关闭');
                    if (!d.open) { eventSource.close(); location.href = '/admin'; }
                });
            });
        }

        /* ============================================================
           本地消息缓存（localStorage，最多 500 条，仅同源）
           ============================================================ */
        function saveMessageToLocal(msg) {
            const key = 'chat_history_' + location.origin;
            let history = JSON.parse(localStorage.getItem(key) || '[]');
            history.push(msg);
            if (history.length > 500) history = history.slice(-500);
            localStorage.setItem(key, JSON.stringify(history));
        }

        /* ============================================================
           Tab 切换（更多面板 / 管理面板）
           通过 id 命名约定定位按钮与内容：
             按钮 #tab-{name} / #admin-tab-{name}
             内容 #more-tab-{name} / #admin-tab-content-{name}
           ============================================================ */
        // ===== 更多面板：Tab 切换 =====
        function switchMoreTab(tab) {
            document.querySelectorAll('.more-tab').forEach(btn => {
                btn.style.background = 'white';
                btn.style.color = '#333';
                btn.style.borderColor = '#ccc';
            });
            document.querySelectorAll('.more-tab-content').forEach(el => el.style.display = 'none');
            const activeBtn = document.getElementById('tab-' + tab);
            const activeContent = document.getElementById('more-tab-' + tab);
            if (activeBtn) { activeBtn.style.background = '#12b7f5'; activeBtn.style.color = 'white'; activeBtn.style.borderColor = '#12b7f5'; }
            if (activeContent) activeContent.style.display = 'block';
        }

        // ===== 管理面板：Tab 切换 =====
        function switchAdminTab(tab) {
            document.querySelectorAll('.admin-tab').forEach(btn => {
                btn.style.background = 'white';
                btn.style.color = '#333';
                btn.style.borderColor = '#ccc';
            });
            document.querySelectorAll('.admin-tab-content').forEach(el => el.style.display = 'none');
            const activeBtn = document.getElementById('admin-tab-' + tab);
            const activeContent = document.getElementById('admin-tab-content-' + tab);
            if (activeBtn) { activeBtn.style.background = '#12b7f5'; activeBtn.style.color = 'white'; activeBtn.style.borderColor = '#12b7f5'; }
            if (activeContent) activeContent.style.display = 'block';
        }

        /* ============================================================
           收藏夹：加载 → 按类型（图片/文件/文本）分组渲染 →
           绑定删除按钮与文件下载（下载前先查 file_exists）
           resultId：容器 id（普通用户 fav-results / 管理员 admin-fav-results）
           ============================================================ */
        function loadFavorites(resultId) {
            const container = document.getElementById(resultId);
            container.innerHTML = '<p style="color:#999;">加载中...</p>';
            fetch(roomBase + '/api/favorites/list?user_id=' + encodeURIComponent(userId))
                .then(r => r.json())
                .then(data => {
                    const items = data.items || [];
                    if (items.length === 0) { container.innerHTML = '<p style="color:#999;">暂无收藏</p>'; return; }
                    // 按类型分组：图片、文件、文本
                    const groups = { image: [], file: [], text: [] };
                    items.forEach(item => {
                        const t = item.msg_type || 'text';
                        if (groups[t]) groups[t].push(item); else groups.text.push(item);
                    });
                    let html = '';
                    const typeLabels = { image: '图片', file: '文件', text: '文本' };
                    for (const [type, list] of Object.entries(groups)) {
                        if (list.length === 0) continue;
                        html += `<div style="font-size:0.8rem;color:#999;margin:10px 0 4px;border-bottom:1px solid #f0f0f0;padding-bottom:4px;">${typeLabels[type]} (${list.length})</div>`;
                        list.forEach(item => {
                            const time = new Date(item.created_at * 1000).toLocaleString('zh-CN');
                            const size = item.file_size != null ? formatFileSize(item.file_size) : '';
                            html += `<div class="fav-item" style="padding:8px 0;border-bottom:1px solid #f5f5f5;font-size:0.85rem;">`;
                            html += `<div style="display:flex;justify-content:space-between;align-items:center;">`;
                            if (type === 'image') {
                                html += `<span style="color:#12b7f5;cursor:pointer;" onclick="openLightbox('${escapeHtml(item.content)}','${escapeHtml(item.file_name || '图片')}')">🖼 ${escapeHtml(item.file_name || '图片')}</span>`;
                            } else if (type === 'file') {
                                html += `<span class="fav-file-link" data-url="${escapeHtml(item.content)}" data-name="${escapeHtml(item.file_name || '文件')}" style="color:#12b7f5;cursor:pointer;">📎 ${escapeHtml(item.file_name || '文件')}</span>`;
                            } else {
                                html += `<span style="word-break:break-all;">${escapeHtml(item.content).substring(0, 80)}</span>`;
                            }
                            html += `<button class="fav-remove-btn" data-fav-id="${item.id}" style="background:none;border:none;color:#f56c6c;cursor:pointer;font-size:0.75rem;padding:2px 6px;">删除</button>`;
                            html += `</div>`;
                            html += `<div style="font-size:0.75rem;color:#999;margin-top:3px;">`;
                            html += `发送者: ${escapeHtml(item.sender)}`;
                            if (size) html += ` · ${size}`;
                            html += ` · ${time}`;
                            html += `</div></div>`;
                        });
                    }
                    container.innerHTML = html;
                    // 绑定删除按钮
                    container.querySelectorAll('.fav-remove-btn').forEach(btn => {
                        btn.addEventListener('click', () => {
                            if (!confirm('确定删除此收藏？')) return;
                            fetch(roomBase + '/api/favorites/remove', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ user_id: userId, fav_id: btn.dataset.favId })
                            }).then(r => r.json()).then(d => {
                                if (d.success) loadFavorites(resultId);
                                else alert(d.error || '删除失败');
                            });
                        });
                    });
                    // 绑定文件下载（先检查文件是否存在）
                    container.querySelectorAll('.fav-file-link').forEach(link => {
                        link.addEventListener('click', () => {
                            const url = link.dataset.url;
                            const name = link.dataset.name;
                            fetch(roomBase + '/api/file_exists?url=' + encodeURIComponent(url))
                                .then(r => r.json())
                                .then(d => {
                                    if (d.exists) {
                                        const a = document.createElement('a');
                                        a.href = url; a.download = name; a.click();
                                    } else {
                                        alert('文件已不存在，无法下载');
                                    }
                                });
                        });
                    });
                });
        }

        // ===== 聊天记录搜索 =====
        // GET /api/query_messages?nickname= → 按发送者分组渲染滚动列表
        function searchChatHistory(nickInputId, resultId) {
            const nick = document.getElementById(nickInputId).value.trim();
            const container = document.getElementById(resultId);
            container.innerHTML = '<p style="color:#999;">加载中...</p>';
            fetch(roomBase + '/api/query_messages?nickname=' + encodeURIComponent(nick))
                .then(res => res.json())
                .then(data => {
                    const groups = data.groups || [];
                    if (groups.length === 0) {
                        container.innerHTML = '<p style="color:#999;">没有找到聊天记录</p>';
                        return;
                    }
                    let html = '';
                    groups.forEach(g => {
                        html += `<div style="margin-bottom:15px;border:1px solid #eee;border-radius:6px;padding:10px;">
                            <div style="font-weight:bold;margin-bottom:6px;">
                                ${escapeHtml(g.avatar || '😀')} ${escapeHtml(g.sender)}
                                <span style="font-size:0.75rem;color:#999;margin-left:6px;">${g.messages.length}条消息</span>
                            </div>
                            <div style="max-height:200px;overflow-y:auto;background:#fafafa;border-radius:4px;padding:6px;">`;
                        g.messages.forEach(m => {
                            const t = new Date(m.timestamp * 1000).toLocaleString('zh-CN');
                            html += `<div style="font-size:0.85rem;margin:3px 0;"><span style="color:#999;">[${t}]</span> ${escapeHtml(m.content)}</div>`;
                        });
                        html += '</div></div>';
                    });
                    container.innerHTML = html;
                })
                .catch(() => { container.innerHTML = '<p style="color:#f56c6c;">加载失败</p>'; });
        }

        // ===== 聊天文件搜索 =====
        // GET /api/query_files?nickname= → 图片内联缩略图 / 文件下载链接；已删除标注 [已删除]
        function searchChatFiles(nickInputId, resultId) {
            const nick = document.getElementById(nickInputId).value.trim();
            const container = document.getElementById(resultId);
            container.innerHTML = '<p style="color:#999;">加载中...</p>';
            fetch(roomBase + '/api/query_files?nickname=' + encodeURIComponent(nick))
                .then(res => res.json())
                .then(data => {
                    const groups = data.groups || [];
                    if (groups.length === 0) {
                        container.innerHTML = '<p style="color:#999;">没有找到文件</p>';
                        return;
                    }
                    let html = '';
                    groups.forEach(g => {
                        const files = g.messages || g.files || [];
                        html += `<div style="margin-bottom:15px;border:1px solid #eee;border-radius:6px;padding:10px;">
                            <div style="font-weight:bold;margin-bottom:6px;">
                                ${escapeHtml(g.avatar || '😀')} ${escapeHtml(g.sender)}
                                <span style="font-size:0.75rem;color:#999;margin-left:6px;">${files.length}个文件</span>
                            </div>
                            <div style="max-height:200px;overflow-y:auto;">`;
                        files.forEach(f => {
                            const t = new Date(f.timestamp * 1000).toLocaleString('zh-CN');
                            const isImg = f.type === 'image';
                            const exists = f.file_exists;
                            if (isImg) {
                                const imgSrc = escapeHtml(f.content);
                                const imgName = escapeHtml(f.file_name || '图片');
                                html += `<div style="margin:4px 0;font-size:0.85rem;">
                                    <span style="color:#999;">[${t}]</span>
                                    <img class="img-bubble" src="${imgSrc}" style="max-width:120px;max-height:80px;vertical-align:middle;" onclick="openLightbox('${imgSrc}','${imgName}')">
                                    <span style="color:#666;"> ${imgName}</span>
                                    ${exists ? '' : '<span style="color:#f56c6c;font-size:0.75rem;"> [已删除]</span>'}
                                </div>`;
                            } else {
                                html += `<div style="margin:4px 0;font-size:0.85rem;">
                                    <span style="color:#999;">[${t}]</span>
                                    ${exists ? `<a href="${escapeHtml(f.content)}" download style="color:#1a5fb4;">📎 ${escapeHtml(f.file_name || '文件')}</a>` : `<span style="color:#999;text-decoration:line-through;">📎 ${escapeHtml(f.file_name || '文件')}</span>`}
                                    ${f.file_size ? `<span style="color:#999;font-size:0.75rem;"> (${formatFileSize(f.file_size)})</span>` : ''}
                                    ${exists ? '' : '<span style="color:#f56c6c;font-size:0.75rem;"> [已删除]</span>'}
                                </div>`;
                            }
                        });
                        html += '</div></div>';
                    });
                    container.innerHTML = html;
                })
                .catch(() => { container.innerHTML = '<p style="color:#f56c6c;">加载失败</p>'; });
        }

        /* ============================================================
           面板交互：点击外部关闭下拉 + 拖拽移动 + 右下角缩放
           ============================================================ */
        // ===== 面板拖拽 + 缩放 =====
        // 点击菜单外区域自动关闭下拉菜单
        document.addEventListener('click', (e) => {
            const adminDD = document.getElementById('admin-window');
            const moreDD = document.getElementById('more-window');
            if (adminDD && adminDD.classList.contains('open') && !e.target.closest('#admin-window') && !e.target.closest('#admin-panel-toggle'))
                adminDD.classList.remove('open');
            if (moreDD && moreDD.classList.contains('open') && !e.target.closest('#more-window') && !e.target.closest('#more-panel-toggle'))
                moreDD.classList.remove('open');
        });

        // 拖拽移动：按住 header 拖动窗口（记录起始鼠标与窗口位置差量）
        function makeDraggable(winEl, headerId) {
            const header = document.getElementById(headerId);
            let isDragging = false, startX, startY, origLeft, origTop;
            header.addEventListener('mousedown', (e) => {
                if (e.target.closest('.close-btn')) return;   // 点关闭按钮不触发拖拽
                isDragging = true;
                startX = e.clientX; startY = e.clientY;
                const rect = winEl.getBoundingClientRect();
                origLeft = rect.left; origTop = rect.top;
                winEl.style.left = origLeft + 'px';
                winEl.style.top = origTop + 'px';
                winEl.style.right = 'auto';   // 从居中定位切到绝对定位
                e.preventDefault();
            });
            document.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                winEl.style.left = (origLeft + e.clientX - startX) + 'px';
                winEl.style.top = (origTop + e.clientY - startY) + 'px';
            });
            document.addEventListener('mouseup', () => { isDragging = false; });
        }

        // 缩放：拖右下角 handle，限制在 340×200 ~ 95%视口 范围内
        function makeResizable(winEl, handleId) {
            const handle = document.getElementById(handleId);
            let isResizing = false, startX, startY, origW, origH;
            const MIN_W = 340, MIN_H = 200, MAX_W = window.innerWidth * 0.95, MAX_H = window.innerHeight * 0.92;
            handle.addEventListener('mousedown', (e) => {
                isResizing = true;
                startX = e.clientX; startY = e.clientY;
                origW = winEl.offsetWidth; origH = winEl.offsetHeight;
                e.preventDefault(); e.stopPropagation();
            });
            document.addEventListener('mousemove', (e) => {
                if (!isResizing) return;
                const nw = Math.min(MAX_W, Math.max(MIN_W, origW + e.clientX - startX));
                const nh = Math.min(MAX_H, Math.max(MIN_H, origH + e.clientY - startY));
                winEl.style.width = nw + 'px';
                winEl.style.height = nh + 'px';
            });
            document.addEventListener('mouseup', () => { isResizing = false; });
        }

        // 给存在的面板绑定拖拽/缩放（管理/更多按角色二选一渲染）
        const adminWin = document.getElementById('admin-window');
        if (adminWin) { makeDraggable(adminWin, 'admin-dock-header'); makeResizable(adminWin, 'admin-resize'); }
        const moreWin = document.getElementById('more-window');
        if (moreWin) { makeDraggable(moreWin, 'more-dock-header'); makeResizable(moreWin, 'more-resize'); }

        // HTML 转义：textContent 取义 + 补引号转义，结果可安全用于标签内容与属性
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            // 补充引号转义，使结果也可安全用于 HTML 属性（如图片 src）
            return div.innerHTML.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        // 页面关闭时通知服务器离线（sendBeacon 用 Blob 指定 JSON content-type）
        window.addEventListener('beforeunload', () => {
            // sendBeacon 直接传字符串会以 text/plain 发送，被后端拒绝；用 Blob 指定 JSON 类型
            if (userId) navigator.sendBeacon(roomBase + '/api/leave',
                new Blob([JSON.stringify({ user_id: userId })], { type: 'application/json' }));
        });
    </script>
