<!DOCTYPE html>
<!--
  rooms.html — 管理员房间管理页
  仅 session.role == 'admin' 时由 /rooms 渲染。
  功能：
    1. 房间卡片网格：二维码缩略图 / 名称 / ID / 开放状态 / 操作按钮
    2. 新建房间（名称 + 可选密码）
    3. 开关房间、删除房间（需确认）
    4. 修改管理员密码（需旧密码）
    5. 全局恢复出厂设置（需当前管理员密码，危险操作二次确认）
    6. 退出登录
  数据来源：GET /api/rooms/status；操作均 POST 对应管理 API。
-->
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>房间管理 - 在线匿名聊天室</title>
    <style>
        /* ===== 基础 ===== */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f0f2f5; min-height: 100vh; padding: 20px; }

        /* ===== 顶部栏 ===== */
        .header { max-width: 900px; margin: 0 auto 20px; display: flex; justify-content: space-between; align-items: center; }
        .header h1 { font-size: 1.4rem; color: #333; }

        /* ===== 通用按钮 ===== */
        .btn { padding: 8px 20px; border-radius: 6px; border: none; cursor: pointer; font-size: 0.9rem; font-weight: 500; transition: opacity .15s; text-decoration: none; display: inline-block; }
        .btn:hover { opacity: 0.85; }
        .btn-primary { background: #12b7f5; color: white; }   /* 主操作：新建 */
        .btn-danger { background: #f56c6c; color: white; }    /* 危险操作：删除/重置 */
        .btn-success { background: #67c23a; color: white; }   /* 进入聊天 */
        .btn-warning { background: #e6a23c; color: white; }   /* 开关/改密码 */
        .btn-sm { padding: 5px 12px; font-size: 0.8rem; }

        /* ===== 房间卡片网格 ===== */
        .room-grid { max-width: 900px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
        .room-card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); transition: box-shadow .2s; }
        .room-card:hover { box-shadow: 0 4px 20px rgba(0,0,0,0.12); }
        .room-card h3 { font-size: 1rem; margin-bottom: 8px; color: #333; }
        .room-card .info { font-size: 0.85rem; color: #666; margin-bottom: 4px; }
        .room-card .status { font-size: 0.8rem; margin-bottom: 12px; }
        .room-card .status .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; vertical-align: middle; }
        .dot-green { background: #67c23a; }   /* 开放中 */
        .dot-red { background: #f56c6c; }     /* 已关闭 */
        .room-card .actions { display: flex; gap: 6px; flex-wrap: wrap; }
        .room-card .qr-thumb { width: 80px; height: 80px; border-radius: 6px; cursor: pointer; border: 1px solid #eee; margin-bottom: 10px; }
        .room-card .qr-thumb:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.1); }

        /* 空状态提示 */
        .empty-msg { max-width: 900px; margin: 40px auto; text-align: center; color: #999; font-size: 0.95rem; }

        /* ===== 模态框（新建/改密码/恢复出厂） ===== */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.4); z-index: 1000; justify-content: center; align-items: center; }
        .modal-overlay.active { display: flex; }
        .modal { background: white; border-radius: 12px; padding: 24px; width: 360px; max-width: 90%; box-shadow: 0 8px 40px rgba(0,0,0,0.2); }
        .modal h3 { font-size: 1.05rem; margin-bottom: 16px; }
        .modal input { width: 100%; padding: 9px 12px; border: 1px solid #dcdfe6; border-radius: 6px; font-size: 0.9rem; margin-bottom: 12px; outline: none; }
        .modal input:focus { border-color: #12b7f5; }
        .modal .modal-actions { display: flex; gap: 8px; justify-content: flex-end; }

        /* ===== 二维码大图预览（点击缩略图打开，点击空白关闭） ===== */
        .qr-modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); z-index: 1000; justify-content: center; align-items: center; cursor: zoom-out; }
        .qr-modal.active { display: flex; }
        .qr-modal img { max-width: 300px; max-height: 300px; border-radius: 8px; background: white; padding: 10px; }
    </style>
</head>
<body>
    <!-- ===== 顶部操作栏 ===== -->
    <div class="header">
        <h1>房间管理</h1>
        <div style="display:flex;gap:8px;">
            <button class="btn btn-warning" id="chpw-btn">修改管理员密码</button>
            <button class="btn btn-danger" id="reset-btn">恢复出厂设置</button>
            <button class="btn btn-primary" id="create-btn">+ 新建房间</button>
            <button class="btn" style="background:#f5f5f5;color:#666;" id="logout-btn">退出</button>
        </div>
    </div>

    <!-- 房间卡片容器（JS 动态渲染） -->
    <div class="room-grid" id="room-grid"></div>
    <div class="empty-msg" id="empty-msg" style="display:none;">暂无房间，点击"新建房间"创建第一个</div>

    <!-- ===== 模态框：新建房间 ===== -->
    <div class="modal-overlay" id="create-modal">
        <div class="modal">
            <h3>新建房间</h3>
            <input type="text" id="new-room-name" placeholder="房间名称" maxlength="30">
            <input type="password" id="new-room-pw" placeholder="密码（可选）">
            <div class="modal-actions">
                <button class="btn" style="background:#f5f5f5;" id="create-cancel">取消</button>
                <button class="btn btn-primary" id="create-confirm">创建</button>
            </div>
        </div>
    </div>

    <!-- ===== 模态框：修改管理员密码（需旧密码 + 两次新密码一致） ===== -->
    <div class="modal-overlay" id="chpw-modal">
        <div class="modal">
            <h3>修改管理员密码</h3>
            <input type="password" id="chpw-old" placeholder="当前密码" autocomplete="current-password">
            <input type="password" id="chpw-new" placeholder="新密码" autocomplete="new-password">
            <input type="password" id="chpw-new2" placeholder="确认新密码" autocomplete="new-password">
            <div class="modal-actions">
                <button class="btn" style="background:#f5f5f5;" id="chpw-cancel">取消</button>
                <button class="btn btn-primary" id="chpw-confirm">确认修改</button>
            </div>
        </div>
    </div>

    <!-- ===== 模态框：全局恢复出厂（危险，需当前密码 + confirm） ===== -->
    <div class="modal-overlay" id="reset-modal">
        <div class="modal">
            <h3 style="color:#f56c6c;">恢复出厂设置</h3>
            <p style="font-size:0.85rem;color:#666;margin-bottom:12px;">将删除所有房间、聊天记录、文件，并将管理员密码重置为 ADMIN。此操作不可撤销！</p>
            <input type="password" id="reset-pw" placeholder="当前管理员密码" autocomplete="current-password">
            <div class="modal-actions">
                <button class="btn" style="background:#f5f5f5;" id="reset-cancel">取消</button>
                <button class="btn btn-danger" id="reset-confirm">确认重置</button>
            </div>
        </div>
    </div>

    <!-- 二维码大图预览 -->
    <div class="qr-modal" id="qr-modal"><img id="qr-modal-img" src=""></div>

    <script>
        // ===== DOM 引用 =====
        const grid = document.getElementById('room-grid');
        const emptyMsg = document.getElementById('empty-msg');
        const createModal = document.getElementById('create-modal');
        const chpwModal = document.getElementById('chpw-modal');
        const resetModal = document.getElementById('reset-modal');
        const qrModal = document.getElementById('qr-modal');
        const qrModalImg = document.getElementById('qr-modal-img');
        const IP = '{{ ip }}';   // 后端注入的局域网 IP（备用）

        // HTML 转义：防止房间名等用户输入破坏 DOM / 注入（含引号，可安全用于属性）
        function escHtml(s) {
            const d = document.createElement('div');
            d.textContent = s || '';
            return d.innerHTML.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        // ===== 房间列表加载 =====
        // GET /api/rooms/status → 渲染卡片（二维码 + 名称 + ID + 状态 + 操作按钮）
        // 房间名只存 JS Map，不拼进 onclick，避免引号导致的 JS 注入
        const roomNames = {};
        function loadRooms() {
            fetch('/api/rooms/status').then(r => r.json()).then(data => {
                const rooms = data.rooms || [];
                if (!rooms.length) { grid.innerHTML = ''; emptyMsg.style.display = 'block'; return; }
                emptyMsg.style.display = 'none';
                grid.innerHTML = rooms.map(r => {
                    roomNames[r.room_id] = r.room_name;
                    const dotClass = r.is_open ? 'dot-green' : 'dot-red';
                    const statusText = r.is_open ? '开放中' : '已关闭';
                    return `<div class="room-card">
                        <img class="qr-thumb" src="/api/rooms/qr/${r.room_id}?t=${Date.now()}" onclick="showQR('${r.room_id}')" alt="二维码">
                        <h3>${escHtml(r.room_name)}</h3>
                        <div class="info">房间ID: ${r.room_id}</div>
                        <div class="status"><span class="dot ${dotClass}"></span>${statusText}</div>
                        <div class="actions">
                            <a href="/room/${r.room_id}/?admin=1" class="btn btn-primary btn-sm">进入管理</a>
                            <a href="/room/${r.room_id}/" class="btn btn-success btn-sm" target="_blank">进入聊天</a>
                            <button class="btn btn-warning btn-sm" onclick="toggleRoom('${r.room_id}')">${r.is_open ? '关闭' : '开启'}</button>
                            <button class="btn btn-danger btn-sm" onclick="deleteRoom('${r.room_id}')">删除</button>
                        </div>
                    </div>`;
                }).join('');
            });
        }

        // ===== 二维码大图预览 =====
        function showQR(roomId) {
            qrModalImg.src = '/api/rooms/qr/' + roomId + '?t=' + Date.now();
            qrModal.classList.add('active');
        }
        // 点击遮罩任意处关闭
        qrModal.addEventListener('click', () => qrModal.classList.remove('active'));

        // ===== 开关房间 =====
        function toggleRoom(roomId) {
            fetch('/api/rooms/toggle', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({room_id: roomId}) })
                .then(r => r.json()).then(() => loadRooms());
        }

        // ===== 删除房间（confirm 确认后调用，房间名从 roomNames 取） =====
        function deleteRoom(roomId) {
            const name = roomNames[roomId] || roomId;
            if (!confirm(`确定删除房间"${name}"？\n所有聊天记录和文件将被清除！`)) return;
            fetch('/api/rooms/delete', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({room_id: roomId}) })
                .then(r => r.json()).then(() => loadRooms());
        }

        // ===== 新建房间模态框 =====
        document.getElementById('create-btn').addEventListener('click', () => {
            document.getElementById('new-room-name').value = '';
            document.getElementById('new-room-pw').value = '';
            createModal.classList.add('active');
            document.getElementById('new-room-name').focus();
        });
        document.getElementById('create-cancel').addEventListener('click', () => createModal.classList.remove('active'));
        // 点击遮罩关闭
        createModal.addEventListener('click', (e) => { if (e.target === createModal) createModal.classList.remove('active'); });
        // 确认创建：名称默认"新房间"，密码可空
        document.getElementById('create-confirm').addEventListener('click', () => {
            const name = document.getElementById('new-room-name').value.trim() || '新房间';
            const pw = document.getElementById('new-room-pw').value;
            fetch('/api/rooms/create', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({name, password: pw || null}) })
                .then(r => r.json()).then(d => { if (d.success) { createModal.classList.remove('active'); loadRooms(); } else alert(d.error || '创建失败'); });
        });

        // ===== 修改管理员密码模态框 =====
        document.getElementById('chpw-btn').addEventListener('click', () => {
            document.getElementById('chpw-old').value = '';
            document.getElementById('chpw-new').value = '';
            document.getElementById('chpw-new2').value = '';
            chpwModal.classList.add('active');
            document.getElementById('chpw-old').focus();
        });
        document.getElementById('chpw-cancel').addEventListener('click', () => chpwModal.classList.remove('active'));
        chpwModal.addEventListener('click', (e) => { if (e.target === chpwModal) chpwModal.classList.remove('active'); });
        // 校验：新密码非空 + 两次一致 → POST /api/admin/change_password
        document.getElementById('chpw-confirm').addEventListener('click', () => {
            const oldPw = document.getElementById('chpw-old').value;
            const newPw = document.getElementById('chpw-new').value;
            const newPw2 = document.getElementById('chpw-new2').value;
            if (!newPw) { alert('请输入新密码'); return; }
            if (newPw !== newPw2) { alert('两次输入的新密码不一致'); return; }
            fetch('/api/admin/change_password', { method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({old_password: oldPw, new_password: newPw}) })
                .then(r => r.json()).then(d => {
                    if (d.success) { chpwModal.classList.remove('active'); alert('密码修改成功'); }
                    else alert(d.error || '修改失败');
                });
        });

        // ===== 全局恢复出厂模态框 =====
        document.getElementById('reset-btn').addEventListener('click', () => {
            document.getElementById('reset-pw').value = '';
            resetModal.classList.add('active');
            document.getElementById('reset-pw').focus();
        });
        document.getElementById('reset-cancel').addEventListener('click', () => resetModal.classList.remove('active'));
        resetModal.addEventListener('click', (e) => { if (e.target === resetModal) resetModal.classList.remove('active'); });
        // 三重防护：密码非空 + confirm 确认 + 后端再验密码 → POST /api/admin/global_reset
        document.getElementById('reset-confirm').addEventListener('click', () => {
            const pw = document.getElementById('reset-pw').value;
            if (!pw) { alert('请输入当前管理员密码'); return; }
            if (!confirm('确定恢复出厂设置？\n所有房间、聊天记录、文件将被永久删除！')) return;
            fetch('/api/admin/global_reset', { method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({password: pw}) })
                .then(r => r.json()).then(d => {
                    if (d.success) { resetModal.classList.remove('active'); alert('已恢复出厂设置'); loadRooms(); }
                    else alert(d.error || '重置失败');
                });
        });

        // ===== 退出登录 =====
        document.getElementById('logout-btn').addEventListener('click', () => {
            fetch('/logout', { method: 'POST' }).then(() => location.href = '/');
        });

        // 页面加载后拉取房间列表
        loadRooms();
    </script>
</body>
</html>
